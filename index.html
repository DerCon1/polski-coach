<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Polish War Machine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 1.5rem;
    }
    h1 {
      text-align: center;
      margin-bottom: 1rem;
    }
    #card {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 1.5rem;
      min-height: 120px;
      margin-bottom: 1rem;
    }
    #polish {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }
    #english {
      font-size: 1.2rem;
      opacity: 0.8;
    }
    button {
      padding: 0.6rem 1rem;
      margin-right: 0.5rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Polish War Machine</h1>

  <div id="card">
    <div id="polish">Loading...</div>
    <div id="english"></div>
  </div>

  <button id="show-btn">Show translation</button>
  <button id="next-btn">Next word</button>

  <script src="app.js"></script>
</body>
</html>
