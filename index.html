<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Polski Coach</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <h1>Polski Coach</h1>
      <p class="subtitle">5–20 minutes a day. No excuses.</p>

      <!-- Deck selection -->
      <div class="deck-buttons">
        <button id="deck-core" class="deck-btn active">Core words</button>
        <button id="deck-verbs" class="deck-btn">Verbs</button>
        <button id="deck-sentences" class="deck-btn">Sentences</button>
      </div>

      <!-- Card -->
      <div class="card">
        <div id="polish" class="polish">Ładowanie...</div>
        <pre id="english" class="english"></pre>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button id="show-btn">Show translation</button>
        <button id="know-btn">I knew it</button>
        <button id="dontknow-btn">I didn’t know</button>
        <button id="next-btn">Next</button>
      </div>

      <!-- Simple stats -->
      <div class="stats">
        <span id="deck-label">Deck: core</span> ·
        <span id="stats-correct">✓ 0</span> /
        <span id="stats-wrong">✗ 0</span>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
